version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: wazeapp_postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wazeapp}
      POSTGRES_USER: ${POSTGRES_USER:-wazeapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wazeapp_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - wazeapp_network
      - web
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wazeapp} -d $${POSTGRES_DB:-wazeapp}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: wazeapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wazeapp_network
      - web
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: wazeapp_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - wazeapp_network
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: wazeapp_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wazeapp}:${POSTGRES_PASSWORD:-wazeapp_dev_password}@postgres:5432/${POSTGRES_DB:-wazeapp}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      MAX_DB_CONNECTIONS: 15
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.05'
    networks:
      - wazeapp_network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wazeapp_backend
    restart: unless-stopped
    extra_hosts:
      - "api-v2.enkap.cm:52.57.163.240"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: ["dumb-init", "--", "node", "dist/cluster.js"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.backend.rule=Host(`api.wazeapp.ai`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend-redirect.rule=Host(`api.wazeapp.ai`)"
      - "traefik.http.routers.backend-redirect.entrypoints=web"
      - "traefik.http.routers.backend-redirect.middlewares=backend-redirect"
      - "traefik.http.middlewares.backend-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.backend.loadbalancer.server.port=3100"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-wazeapp}:${POSTGRES_PASSWORD:-wazeapp_dev_password}@pgbouncer:6432/${POSTGRES_DB:-wazeapp}
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: 6432
      DATABASE_DIRECT_HOST: postgres
      DATABASE_DIRECT_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-wazeapp}
      DATABASE_USERNAME: ${POSTGRES_USER:-wazeapp}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-wazeapp_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION_TIME: 15m
      JWT_REFRESH_EXPIRATION_TIME: 7d
      FRONTEND_URL: https://wazeapp.ai
      DASHBOARD_URL: https://app.wazeapp.ai
      API_URL: https://api.wazeapp.ai
      BAILEYS_WEBHOOK_URL: http://localhost:3100/api/whatsapp/webhook
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:14b
      GOOGLE_CLIENT_ID: "disabled"
      GOOGLE_CLIENT_SECRET: "disabled"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-disabled}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-disabled}"
      MICROSOFT_CLIENT_ID: "disabled"
      MICROSOFT_CLIENT_SECRET: "disabled"
      DEEPSEEK_API_KEY: "disabled"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-1}
    volumes:
      - ./backend/whatsapp-sessions:/app/whatsapp-sessions
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    ports:
      - "3100:3100"
    networks:
      - wazeapp_network
      - web
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile.production
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_API_URL=http://localhost:3100/api/v1
        - NEXT_PUBLIC_SOCKET_URL=http://localhost:3100
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: wazeapp_dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3100/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3100
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    ports:
      - "3101:3101"
    networks:
      - wazeapp_network
      - web
    healthcheck:
      disable: true

  marketing:
    build:
      context: ./frontend/marketing
      dockerfile: Dockerfile.production
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_API_URL=http://localhost:3100/api/v1
        - NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3101
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
    container_name: wazeapp_marketing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3100/api/v1
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3101
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    ports:
      - "3102:3102"
    networks:
      - wazeapp_network
      - web
    healthcheck:
      disable: true


networks:
  wazeapp_network:
    driver: bridge
  web:
    external: true

volumes:
  postgres_data:
  redis_data:
  ollama_data:
