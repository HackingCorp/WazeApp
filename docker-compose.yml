version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: wazeapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wazeapp
      POSTGRES_USER: wazeapp
      POSTGRES_PASSWORD: wazeapp123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - wazeapp_network
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wazeapp -d wazeapp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: wazeapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wazeapp_network
      - web
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: wazeapp_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - wazeapp_network
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wazeapp_backend
    restart: unless-stopped
    extra_hosts:
      - "api-v2.enkap.cm:52.57.163.240"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: ["dumb-init", "--", "node", "dist/main.js"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.backend.rule=Host(`api.wazeapp.xyz`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend-redirect.rule=Host(`api.wazeapp.xyz`)"
      - "traefik.http.routers.backend-redirect.entrypoints=web"
      - "traefik.http.routers.backend-redirect.middlewares=backend-redirect"
      - "traefik.http.middlewares.backend-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.backend.loadbalancer.server.port=3100"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wazeapp:wazeapp123@postgres:5432/wazeapp
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: wazeapp
      DATABASE_USERNAME: wazeapp
      DATABASE_PASSWORD: wazeapp123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: 5f4d2a8b9c7e1f3a6d8b2c7e9f4a6d8b3c7e9f4a
      JWT_ACCESS_SECRET: your-access-secret-key-here
      JWT_REFRESH_SECRET: your-refresh-secret-key-here
      JWT_ACCESS_EXPIRATION_TIME: 15m
      JWT_REFRESH_EXPIRATION_TIME: 7d
      FRONTEND_URL: https://wazeapp.xyz
      DASHBOARD_URL: https://app.wazeapp.xyz
      API_URL: https://api.wazeapp.xyz
      BAILEYS_WEBHOOK_URL: http://localhost:3100/api/whatsapp/webhook
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:14b
      GOOGLE_CLIENT_ID: "disabled"
      GOOGLE_CLIENT_SECRET: "disabled"
      FACEBOOK_APP_ID: "disabled"
      FACEBOOK_APP_SECRET: "disabled"
      MICROSOFT_CLIENT_ID: "disabled"
      MICROSOFT_CLIENT_SECRET: "disabled"
      DEEPSEEK_API_KEY: "disabled"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://analytics.wazeapp.xyz}
    volumes:
      - ./backend/whatsapp-sessions:/app/whatsapp-sessions
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    ports:
      - "3100:3100"
    networks:
      - wazeapp_network
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile.production
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_API_URL=http://localhost:3100/api/v1
        - NEXT_PUBLIC_SOCKET_URL=http://localhost:3100
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://analytics.wazeapp.xyz}
    container_name: wazeapp_dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3100/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3100
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://analytics.wazeapp.xyz}
    ports:
      - "3101:3101"
    networks:
      - wazeapp_network
      - web
    healthcheck:
      disable: true

  marketing:
    build:
      context: ./frontend/marketing
      dockerfile: Dockerfile.production
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_API_URL=http://localhost:3100/api/v1
        - NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3101
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://analytics.wazeapp.xyz}
    container_name: wazeapp_marketing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3100/api/v1
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3101
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://analytics.wazeapp.xyz}
    ports:
      - "3102:3102"
    networks:
      - wazeapp_network
      - web
    healthcheck:
      disable: true

  # ============================================================
  # PostHog Analytics (self-hosted)
  # ============================================================

  posthog-db:
    image: postgres:15-alpine
    container_name: posthog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: posthog
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
    volumes:
      - posthog_postgres_data:/var/lib/postgresql/data
    networks:
      - wazeapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog -d posthog"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  posthog-redis:
    image: redis:7-alpine
    container_name: posthog_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - posthog_redis_data:/data
    networks:
      - wazeapp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  posthog-zookeeper:
    image: docker.io/bitnami/zookeeper:3.8
    container_name: posthog_zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "true"
    volumes:
      - posthog_zookeeper_data:/bitnami/zookeeper
    networks:
      - wazeapp_network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  posthog-kafka:
    image: docker.io/bitnami/kafka:3.4
    container_name: posthog_kafka
    restart: unless-stopped
    depends_on:
      posthog-zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1001
      KAFKA_CFG_RESERVED_BROKER_MAX_ID: 1001
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://posthog-kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: posthog-zookeeper:2181
      KAFKA_CFG_LOG_RETENTION_HOURS: 1
      KAFKA_CFG_LOG_RETENTION_MS: 3600000
    volumes:
      - posthog_kafka_data:/bitnami/kafka
    networks:
      - wazeapp_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  posthog-clickhouse:
    image: clickhouse/clickhouse-server:23.12.5.81-alpine
    container_name: posthog_clickhouse
    restart: on-failure
    depends_on:
      posthog-kafka:
        condition: service_healthy
      posthog-zookeeper:
        condition: service_healthy
    volumes:
      - ./posthog-config/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ./posthog-config/clickhouse/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./posthog-config/clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml
      - posthog_clickhouse_data:/var/lib/clickhouse
    networks:
      - wazeapp_network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  posthog-objectstorage:
    image: minio/minio:RELEASE.2022-06-25T15-50-16Z
    container_name: posthog_objectstorage
    restart: on-failure
    environment:
      MINIO_ROOT_USER: object_storage_root_user
      MINIO_ROOT_PASSWORD: object_storage_root_password
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog && minio server --address ":19000" --console-address ":19001" /data'
    volumes:
      - posthog_objectstorage:/data
    networks:
      - wazeapp_network

  posthog-kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    container_name: posthog_kafka_init
    depends_on:
      posthog-kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      until rpk cluster info --brokers posthog-kafka:9092; do sleep 2; done;
      rpk topic create --brokers posthog-kafka:9092 exceptions_ingestion clickhouse_events_json;
      echo 'Kafka topics created';
      "
    networks:
      - wazeapp_network
    restart: "no"

  posthog:
    image: ghcr.io/posthog/posthog/posthog:latest
    container_name: posthog_web
    restart: on-failure
    command: /compose/start
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.posthog.rule=Host(`analytics.wazeapp.xyz`)"
      - "traefik.http.routers.posthog.tls=true"
      - "traefik.http.routers.posthog.tls.certresolver=le"
      - "traefik.http.routers.posthog.entrypoints=websecure"
      - "traefik.http.routers.posthog-redirect.rule=Host(`analytics.wazeapp.xyz`)"
      - "traefik.http.routers.posthog-redirect.entrypoints=web"
      - "traefik.http.routers.posthog-redirect.middlewares=posthog-redirect"
      - "traefik.http.middlewares.posthog-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.posthog.loadbalancer.server.port=8000"
    environment:
      SECRET_KEY: ${POSTHOG_SECRET:-ch4ng3m3-p0sth0g-s3cr3t-k3y-pr0duct10n}
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT:-posthog-default-encryption-salt}
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      REDIS_URL: redis://posthog-redis:6379/
      PGHOST: posthog-db
      PGUSER: posthog
      PGPASSWORD: posthog
      OBJECT_STORAGE_ENDPOINT: http://posthog-objectstorage:19000
      OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
      OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
      OBJECT_STORAGE_BUCKET: posthog
      SITE_URL: https://analytics.wazeapp.xyz
      DEPLOYMENT: hobby
      USE_GRANIAN: "true"
      GRANIAN_WORKERS: "2"
    volumes:
      - ./posthog-config/compose:/compose
    networks:
      - wazeapp_network
      - web

  posthog-worker:
    image: ghcr.io/posthog/posthog/posthog:latest
    container_name: posthog_worker
    restart: on-failure
    command: ./bin/docker-worker-celery --with-scheduler
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
    environment:
      SECRET_KEY: ${POSTHOG_SECRET:-ch4ng3m3-p0sth0g-s3cr3t-k3y-pr0duct10n}
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT:-posthog-default-encryption-salt}
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      REDIS_URL: redis://posthog-redis:6379/
      PGHOST: posthog-db
      PGUSER: posthog
      PGPASSWORD: posthog
      OBJECT_STORAGE_ENDPOINT: http://posthog-objectstorage:19000
      OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
      OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
      OBJECT_STORAGE_BUCKET: posthog
      SITE_URL: https://analytics.wazeapp.xyz
      DEPLOYMENT: hobby
    volumes:
      - ./posthog-config/compose:/compose
    networks:
      - wazeapp_network

  posthog-plugins:
    image: ghcr.io/posthog/posthog/posthog:latest
    container_name: posthog_plugins
    restart: on-failure
    command: ./bin/plugin-server --no-restart-loop
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
    environment:
      SECRET_KEY: ${POSTHOG_SECRET:-ch4ng3m3-p0sth0g-s3cr3t-k3y-pr0duct10n}
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT:-posthog-default-encryption-salt}
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      REDIS_URL: redis://posthog-redis:6379/
      PGHOST: posthog-db
      PGUSER: posthog
      PGPASSWORD: posthog
      OBJECT_STORAGE_ENDPOINT: http://posthog-objectstorage:19000
      OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
      OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
      OBJECT_STORAGE_BUCKET: posthog
      SITE_URL: https://analytics.wazeapp.xyz
      DEPLOYMENT: hobby
    networks:
      - wazeapp_network

networks:
  wazeapp_network:
    driver: bridge
  web:
    external: true

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  posthog_postgres_data:
  posthog_redis_data:
  posthog_zookeeper_data:
  posthog_kafka_data:
  posthog_clickhouse_data:
  posthog_objectstorage:
